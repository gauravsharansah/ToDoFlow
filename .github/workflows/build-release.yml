name: Build & Release

# Release assets (five):
#   ToDoFlow-<version>-Windows.exe   ToDoFlow-<version>-Linux.AppImage
#   ToDoFlow-<version>-macOS-x64.dmg (Intel)   ToDoFlow-<version>-macOS-arm64.dmg (Apple Silicon)
#   ToDoFlow-<version>-Android.apk
# iOS is not built: it needs a paid Apple Developer account for signing.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Inject Firebase credentials
        shell: bash
        env:
          FIREBASE_API_KEY:             ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN:         ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID:          ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET:      ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID:              ${{ secrets.FIREBASE_APP_ID }}
        run: |
          sed -i "s|__FIREBASE_API_KEY__|${FIREBASE_API_KEY}|g"                         src/index.html
          sed -i "s|__FIREBASE_AUTH_DOMAIN__|${FIREBASE_AUTH_DOMAIN}|g"                 src/index.html
          sed -i "s|__FIREBASE_PROJECT_ID__|${FIREBASE_PROJECT_ID}|g"                   src/index.html
          sed -i "s|__FIREBASE_STORAGE_BUCKET__|${FIREBASE_STORAGE_BUCKET}|g"           src/index.html
          sed -i "s|__FIREBASE_MESSAGING_SENDER_ID__|${FIREBASE_MESSAGING_SENDER_ID}|g" src/index.html
          sed -i "s|__FIREBASE_APP_ID__|${FIREBASE_APP_ID}|g"                           src/index.html

      - name: Build Windows installer
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/ToDoFlow-*-Windows.exe

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Inject Firebase credentials
        shell: bash
        env:
          FIREBASE_API_KEY:             ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN:         ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID:          ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET:      ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID:              ${{ secrets.FIREBASE_APP_ID }}
        run: |
          sed -i "s|__FIREBASE_API_KEY__|${FIREBASE_API_KEY}|g"                         src/index.html
          sed -i "s|__FIREBASE_AUTH_DOMAIN__|${FIREBASE_AUTH_DOMAIN}|g"                 src/index.html
          sed -i "s|__FIREBASE_PROJECT_ID__|${FIREBASE_PROJECT_ID}|g"                   src/index.html
          sed -i "s|__FIREBASE_STORAGE_BUCKET__|${FIREBASE_STORAGE_BUCKET}|g"           src/index.html
          sed -i "s|__FIREBASE_MESSAGING_SENDER_ID__|${FIREBASE_MESSAGING_SENDER_ID}|g" src/index.html
          sed -i "s|__FIREBASE_APP_ID__|${FIREBASE_APP_ID}|g"                           src/index.html

      - name: Build Linux AppImage
        run: npm run dist:linux

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/ToDoFlow-*-Linux.AppImage

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Inject Firebase credentials
        env:
          FIREBASE_API_KEY:             ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN:         ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID:          ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET:      ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID:              ${{ secrets.FIREBASE_APP_ID }}
        run: |
          sed -i "" "s|__FIREBASE_API_KEY__|${FIREBASE_API_KEY}|g"                         src/index.html
          sed -i "" "s|__FIREBASE_AUTH_DOMAIN__|${FIREBASE_AUTH_DOMAIN}|g"                 src/index.html
          sed -i "" "s|__FIREBASE_PROJECT_ID__|${FIREBASE_PROJECT_ID}|g"                   src/index.html
          sed -i "" "s|__FIREBASE_STORAGE_BUCKET__|${FIREBASE_STORAGE_BUCKET}|g"           src/index.html
          sed -i "" "s|__FIREBASE_MESSAGING_SENDER_ID__|${FIREBASE_MESSAGING_SENDER_ID}|g" src/index.html
          sed -i "" "s|__FIREBASE_APP_ID__|${FIREBASE_APP_ID}|g"                           src/index.html

      - name: Build DMGs (Intel x64 + Apple Silicon arm64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:mac

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/ToDoFlow-*-macOS-*.dmg

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm ci

      - name: Inject Firebase credentials
        env:
          FIREBASE_API_KEY:             ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN:         ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID:          ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET:      ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID:              ${{ secrets.FIREBASE_APP_ID }}
        run: |
          sed -i "s|__FIREBASE_API_KEY__|${FIREBASE_API_KEY}|g"                         src/index.html
          sed -i "s|__FIREBASE_AUTH_DOMAIN__|${FIREBASE_AUTH_DOMAIN}|g"                 src/index.html
          sed -i "s|__FIREBASE_PROJECT_ID__|${FIREBASE_PROJECT_ID}|g"                   src/index.html
          sed -i "s|__FIREBASE_STORAGE_BUCKET__|${FIREBASE_STORAGE_BUCKET}|g"           src/index.html
          sed -i "s|__FIREBASE_MESSAGING_SENDER_ID__|${FIREBASE_MESSAGING_SENDER_ID}|g" src/index.html
          sed -i "s|__FIREBASE_APP_ID__|${FIREBASE_APP_ID}|g"                           src/index.html

      - run: npx cap sync android --inline
      - run: chmod +x android/gradlew

      # With the ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets set,
      # the APK is signed with one permanent key, so every release installs over
      # the previous one. Without them it falls back to a debug-signed APK (which
      # installs, but cannot update an APK built by a different run).
      - name: Build APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd android
          if [ -n "$KS_B64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/todoflow-release.p12"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/todoflow-release.p12"
            ./gradlew assembleRelease --no-daemon
            SRC=app/build/outputs/apk/release/app-release.apk
          else
            echo "::warning::Android signing secrets not set - building a debug-signed APK; it will not update over an APK from a different build."
            ./gradlew assembleDebug --no-daemon
            SRC=app/build/outputs/apk/debug/app-debug.apk
          fi
          mkdir -p app/build/outputs/final
          mv "$SRC" "app/build/outputs/final/ToDoFlow-${VERSION}-Android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android/app/build/outputs/final/ToDoFlow-*-Android.apk

  release:
    name: GitHub Release
    needs: [windows, linux, macos, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files

      - run: find release-files -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/**/*
          body: release ${{ github.ref_name }}
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
